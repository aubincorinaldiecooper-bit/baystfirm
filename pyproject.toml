[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "baystfirm"
version = "0.1.0"
description = "Realtime crypto market intelligence and evaluation service."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "aiosqlite>=0.21,<1",
  "fastapi>=0.115,<1",
  "feedparser>=6.0.11,<7",
  "httpx>=0.28,<1",
  "pydantic>=2.10,<3",
  "solders>=0.26,<1",
  "talipp>=2.7,<3",
  "uvicorn[standard]>=0.34,<1",
  "websockets>=15,<16",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.15,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "ruff>=0.16,<1",
]

[project.scripts]
baystfirm = "baystfirm.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/baystfirm"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["baystfirm"]

[[tool.mypy.overrides]]
module = "talipp.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "feedparser.*"
ignore_missing_imports = true
